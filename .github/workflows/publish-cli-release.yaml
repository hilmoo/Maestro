name: Publish CLI Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmoo/Maestro'

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Build maestro-cli distribution
        run: ./gradlew :maestro-cli:distZip --no-daemon --no-parallel

      - name: Rename distribution to match release version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cp maestro-cli/build/distributions/maestro.zip "maestro-cli/build/distributions/maestro-${VERSION}.zip"

      - name: Upload distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          gh release upload "$VERSION" "maestro-cli/build/distributions/maestro-${VERSION}.zip"
